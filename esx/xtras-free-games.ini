; ES-X X-TRAS - Free Games Catalog v1
; Strict policy: only titles with explicit redistribution rights.
; No abandonware, freeware-only titles, fan games, or unclear asset licenses.
;
; Fields:
; title             = visible title
; system            = RetroPie ROM folder
; filename          = destination filename
; author            = author/developer credit
; license           = license(s) governing redistribution
; summary           = short UI description (English)
; source            = upstream project
; license_url       = upstream license evidence
; download          = stable direct ROM/archive URL when verified
; official_download = official download/release page when a mirror is still needed
; mirror            = no  -> direct upstream URL is ready
;                     yes -> redistribution is allowed, but X-TRAS should host a pinned copy
; ready             = yes only when download= is present and ready for X-TRAS


